name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HotRod.slnx

      - name: Build
        run: dotnet build HotRod.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test test/HotRod.Client.Tests/HotRod.Client.Tests.csproj -c Release --no-build

      - name: Integration tests
        run: dotnet test test/HotRod.Client.IntegrationTests/HotRod.Client.IntegrationTests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/HotRod.Client/HotRod.Client.csproj -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      # Publish to nuget.org only when the API key secret is configured; a fork or a repo without the
      # secret still builds, tests, and packs, but skips the push instead of failing.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set; skipping the nuget.org push."
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          if compgen -G "artifacts/*.snupkg" > /dev/null; then
            dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi
