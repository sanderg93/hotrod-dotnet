name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HotRod.slnx

      - name: Build
        run: dotnet build HotRod.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test test/HotRod.Client.Tests/HotRod.Client.Tests.csproj -c Release --no-build

      - name: Integration tests
        run: dotnet test test/HotRod.Client.IntegrationTests/HotRod.Client.IntegrationTests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/HotRod.Client/HotRod.Client.csproj -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        run: dotnet nuget push artifacts/Hotrod.Client.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
