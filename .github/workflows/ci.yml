name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore HotRod.slnx

      - name: Build
        run: dotnet build HotRod.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test test/HotRod.Client.Tests/HotRod.Client.Tests.csproj -c Release --no-build

      # The GitHub-hosted Ubuntu runner ships a working Docker daemon, which Testcontainers uses to
      # start a real Infinispan server for the end-to-end tests.
      - name: Integration tests
        run: dotnet test test/HotRod.Client.IntegrationTests/HotRod.Client.IntegrationTests.csproj -c Release --no-build
